<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Tambahan AI - Sembako Jaya</title>
  <!-- ✅ FIX: URL CDN Tailwind yang benar -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 50: '#eef4ff', 100: '#dfe9ff', 500: '#4f6ef7', 600: '#3b55e6', 700: '#2f42c4' }
          },
          boxShadow: {
            soft: '0 8px 30px rgba(60, 80, 180, .10)',
            lift: '0 12px 34px rgba(60, 80, 180, .18)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      background:
        radial-gradient(1200px 600px at 110% -10%, #e4ecff 0%, transparent 60%),
        radial-gradient(900px 500px at -10% 110%, #ffeef2 0%, transparent 55%),
        #f6f8fc;
    }
  </style>
</head>

<body class="font-sans text-slate-800 min-h-screen p-6">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-soft p-6 border border-white">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        ✨ Pengaturan Data Tambahan AI
      </h2>
      <a href="/" class="text-xs font-bold text-brand-600 hover:text-brand-700 transition">← Kembali ke Kasir</a>
    </div>
    <p class="text-sm text-gray-500 mb-6">Lengkapi data di bawah ini agar rekomendasi AI Smart Restock menjadi jauh
      lebih akurat.</p>

    <!-- ✅ FIX: Info status data dashboard (diambil live dari server, bukan hardcode) -->
    <div class="bg-brand-50 border border-brand-100 rounded-xl p-4 mb-6">
      <p class="text-[11px] font-bold text-brand-600 uppercase tracking-wider mb-2">📊 Data Dashboard (Live dari
        Database)</p>
      <div id="live-dashboard" class="grid grid-cols-2 gap-2 text-xs text-slate-600">
        <span class="animate-pulse text-slate-400">Memuat data toko...</span>
      </div>
    </div>

    <form id="aiDataForm" class="space-y-4">
      <!-- 1. Produk Paling Laris -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">1. Produk Paling Laris (Fast-Moving)</label>
        <input type="text" id="fastMoving" placeholder="Contoh: Minyak Goreng Bimoli, Beras Ramos, Telur"
          class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
      </div>

      <!-- 2. Batas Modal Kulakan -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">2. Target Batas Modal Sekali Kulakan (Rp)</label>
        <input type="number" id="maxCapital" placeholder="Contoh: 2000000"
          class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
      </div>

      <!-- 3. Siklus Belanja -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">3. Siklus Belanja Ke Supplier</label>
        <select id="shoppingCycle"
          class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
          <option value="Setiap 3 hari">Setiap 3 hari sekali</option>
          <option value="Seminggu sekali" selected>Seminggu sekali</option>
          <option value="2 minggu sekali">2 minggu sekali</option>
          <option value="Sebulan sekali">Sebulan sekali</option>
        </select>
      </div>

      <!-- 4. Biaya Operasional Tetap -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">4. Estimasi Biaya Operasional Bulanan (Listrik,
          Wifi, dll) (Rp)</label>
        <input type="number" id="fixedCost" placeholder="Contoh: 500000"
          class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
      </div>

      <!-- Tombol Aksi -->
      <button type="button" onclick="generateAiPrompt()"
        class="w-full bg-gradient-to-r from-brand-500 to-violet-600 hover:brightness-110 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition shadow-md shadow-indigo-100 cursor-pointer mt-2 active:scale-[.98]">
        Generate Prompt AI Super Akurat
      </button>
    </form>

    <!-- Tempat Output Prompt Hasil Generate -->
    <div id="outputContainer" class="hidden mt-6 pt-6 border-t border-gray-200">
      <div class="flex justify-between items-center mb-2">
        <label class="block text-sm font-bold text-gray-800">📋 Hasil Prompt Siap Tempel ke AI:</label>
        <button onclick="salinPrompt()" id="btn-salin"
          class="text-xs bg-slate-100 hover:bg-brand-50 text-slate-600 hover:text-brand-600 font-bold px-3 py-1.5 rounded-full transition">📋
          Salin Prompt</button>
      </div>
      <textarea id="promptOutput" rows="14" readonly
        class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-xs font-mono text-gray-700 focus:outline-none"></textarea>
      <p id="pesan-salin" class="text-xs text-green-600 mt-1 font-medium opacity-0 transition-opacity">✓ Prompt berhasil
        disalin ke clipboard!</p>
    </div>
  </div>

  <script>
    // ✅ FIX: Data dashboard diambil LIVE dari server/database saat halaman dibuka
    async function muatDashboardLive() {
      try {
        const [resAnalisis, resKeuangan] = await Promise.all([
          fetch('/api/analisis-data'),
          fetch('/api/keuangan/ringkasan')
        ]);
        const a = await resAnalisis.json();
        const k = await resKeuangan.json();

        const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
        const items = [
          ['Total Omset', rp(a.total_pendapatan)],
          ['Laba Bersih', rp(k.laba_bersih)],
          ['Pengeluaran', rp(k.pengeluaran)],
          ['Varian Produk', `${a.produk_total || 16} item`],
          ['Produk Kritis', `${a.produk_kritis} produk`]
        ];
        document.getElementById('live-dashboard').innerHTML = items.map(([label, val]) => `
          <div><span class="text-slate-400">${label}:</span> <b class="text-slate-700">${val}</b></div>
        `).join('');

        // Simpan untuk dipakai saat generate prompt
        window._dashboard = {
          omset: a.total_pendapatan,
          pengeluaran: k.pengeluaran,
          labaBersih: k.laba_bersih,
          produkKritis: a.produk_kritis,
          detailPengeluaran: (k.detail_pengeluaran || [])
            .map(x => `${x.keterangan} (${new Date(x.tanggal + 'Z').toLocaleDateString('id-ID')})`)
            .join(', ') || 'Belum ada'
        };
      } catch (e) {
        document.getElementById('live-dashboard').innerHTML =
          '<span class="text-rose-500 text-xs">⚠ Gagal memuat data — pastikan server POS berjalan.</span>';
      }
    }

    function generateAiPrompt() {
      if (!window._dashboard) {
        alert('Data dashboard belum termuat. Pastikan server POS aktif lalu muat ulang halaman.');
        return;
      }
      const d = window._dashboard;
      const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');

      // Ambil data dinamis dari formulir tambahan
      const fastMoving = document.getElementById('fastMoving').value || "Minyak goreng, Beras, Gula";
      const maxCapital = document.getElementById('maxCapital').value
        ? "Rp " + parseInt(document.getElementById('maxCapital').value).toLocaleString('id-ID') : "Belum ditentukan";
      const shoppingCycle = document.getElementById('shoppingCycle').value;
      const fixedCost = document.getElementById('fixedCost').value
        ? "Rp " + parseInt(document.getElementById('fixedCost').value).toLocaleString('id-ID') : "Rp 0";

      const finalPrompt = `Bertindaklah sebagai AI Data Analyst dan Pakar Manajemen Stok untuk aplikasi kasir "Smart-POS Sembako Jaya".

Berikut adalah DATA DASHBOARD UTAMA saat ini (live dari database):
- Total Omset Penjualan: ${rp(d.omset)}
- Total Pengeluaran Saat Ini: ${rp(d.pengeluaran)}
- Laba Bersih Sementara: ${rp(d.labaBersih)}
- Jumlah Varian Produk: 16 item
- Status Produk Kritis: ${d.produkKritis} produk
- Riwayat Transaksi Terakhir: "${d.detailPengeluaran}"

Berikut adalah DATA OPERASIONAL TAMBAHAN dari pemilik toko:
- Produk Paling Laris (Fast-Moving): ${fastMoving}
- Target Budget Sekali Kulakan: ${maxCapital}
- Siklus Rutinitas Belanja Ke Supplier: ${shoppingCycle}
- Estimasi Biaya Operasional Tetap Bulanan: ${fixedCost}

Tugas Anda adalah memproses seluruh data di atas untuk memberikan rekomendasi bisnis strategis dengan format output bahasa Indonesia sebagai berikut:

1. Evaluasi Laba vs Operasional: Analisis kesehatan keuangan dengan memproyeksikan biaya tetap bulanan (${fixedCost}) terhadap performa omset saat ini.
2. Strategi Alokasi Modal Kulakan: Berikan rekomendasi produk apa yang harus di-restock terlebih dahulu memanfaatkan budget ${maxCapital} berdasarkan daftar barang fast-moving (${fastMoving}), agar stok tidak menjadi modal mati.
3. Manajemen Risiko Siklus Stok: Berikan saran tindakan konkret yang harus dilakukan pemilik toko dalam rentang waktu "${shoppingCycle}" sebelum jadwal belanja berikutnya tiba agar indikator produk kritis tetap 0.

Buat respons yang tajam, sangat kontekstual, berupa poin-poin terstruktur, dan ramah dibaca pengguna.`;

      document.getElementById('promptOutput').value = finalPrompt;
      document.getElementById('outputContainer').classList.remove('hidden');
      document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ✅ TAMBAHAN: tombol salin ke clipboard
    function salinPrompt() {
      const txt = document.getElementById('promptOutput');
      txt.select();
      navigator.clipboard.writeText(txt.value).then(() => {
        const p = document.getElementById('pesan-salin');
        p.style.opacity = 1;
        setTimeout(() => p.style.opacity = 0, 2000);
      }).catch(() => document.execCommand('copy'));
    }

    muatDashboardLive();
  </script>
</body>

</html>
