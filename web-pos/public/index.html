<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>Sembako Jaya | POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sidebar-transition { transition: transform 180ms ease-in-out; }
    @media print {
      body.printing * { visibility: hidden !important; }
      body.printing #receipt-modal, body.printing #receipt-modal * { visibility: visible !important; }
      body.printing #receipt-modal { position: absolute !important; inset: 0 !important; display: block !important; overflow: visible !important; background: white !important; padding: 0 !important; }
      body.printing #receipt-card { margin: 0 auto !important; width: 80mm !important; max-width: 80mm !important; border: 0 !important; box-shadow: none !important; }
      body.printing .receipt-actions { display: none !important; }
      body.printing-report * { visibility: hidden !important; }
      body.printing-report #finance-report, body.printing-report #finance-report * { visibility: visible !important; }
      body.printing-report #finance-report { position: absolute !important; inset: 0 !important; width: 100% !important; padding: 24px !important; background: white !important; }
      body.printing-report #finance-report button, body.printing-report #finance-report select, body.printing-report #finance-report input { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <section id="auth-screen" class="hidden min-h-screen items-center justify-center bg-gradient-to-br from-blue-50 via-indigo-100 to-blue-200 px-4 py-10">
    <div class="w-full max-w-md">
      <div class="mb-7 text-center">
        <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white shadow-lg shadow-indigo-900/15">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 4l9 6.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-9ZM8 21v-7h8v7"/></svg>
        </span>
        <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">Sembako Jaya</h1>
        <p class="mt-1 text-sm text-slate-500">Masuk untuk mengelola toko dan transaksi</p>
      </div>
      <div class="rounded-2xl border border-white/80 bg-white p-6 shadow-xl shadow-slate-900/10 sm:p-8">
        <h2 id="auth-title" class="text-xl font-bold text-slate-900">Masuk</h2>
        <p id="auth-description" class="mt-1 text-sm text-slate-500"></p>
        <div id="auth-error" class="mt-4 hidden rounded-lg border border-rose-200 bg-rose-50 px-3 py-2.5 text-sm text-rose-700" role="alert"></div>
        <form id="auth-form" class="mt-6 space-y-4">
          <label id="auth-name-wrap" class="hidden block text-sm font-medium text-slate-700">Nama kasir / admin
            <input name="nama" maxlength="80" autocomplete="name" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10">
          </label>
          <label class="block text-sm font-medium text-slate-700">Username
            <input name="username" required minlength="3" maxlength="32" autocomplete="username" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10">
          </label>
          <label class="block text-sm font-medium text-slate-700">Kata sandi
            <span class="relative mt-1.5 block">
              <input id="auth-password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 pr-12 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10">
              <button id="toggle-password" type="button" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 transition hover:text-indigo-700" aria-label="Tampilkan kata sandi" aria-pressed="false">
                <svg data-eye-icon class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </span>
          </label>
          <button id="auth-submit" type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700">Masuk</button>
        </form>
        <p class="mt-5 text-center text-sm text-slate-500"><span id="auth-switch-prompt"></span>
          <button id="auth-switch" type="button" class="font-semibold text-indigo-700 transition duration-200 hover:text-blue-800"></button>
        </p>
        <p class="mt-5 rounded-lg bg-slate-50 px-3 py-2.5 text-xs leading-5 text-slate-500">Akun dan data toko disimpan pada penyimpanan browser perangkat ini.</p>
      </div>
    </div>
  </section>

  <div id="app-shell" class="hidden min-h-screen">
    <div id="sidebar-overlay" class="fixed inset-0 z-40 hidden bg-slate-950/40 lg:hidden" aria-hidden="true"></div>
    <aside id="sidebar" class="sidebar-transition fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col border-r border-slate-200 bg-white px-5 py-6 lg:translate-x-0">
      <a href="/?page=dashboard" data-page="dashboard" class="mb-9 flex items-center gap-3 px-2" aria-label="Sembako Jaya Dashboard">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 4l9 6.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-9Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 21v-7h8v7M7 10h.01M17 10h.01"/></svg>
        </span>
        <span><span class="block text-base font-bold tracking-tight text-slate-900">Sembako Jaya</span><span class="text-xs text-slate-500">Point of Sale</span></span>
      </a>
      <nav id="navigation" class="flex-1 space-y-7" aria-label="Navigasi utama"></nav>
      <div class="mt-8 rounded-xl bg-slate-50 p-4">
        <p class="text-xs font-semibold text-slate-700">Sembako Jaya POS</p>
        <p class="mt-1 text-xs leading-5 text-slate-500">Data transaksi, stok, dan pemasok toko Anda.</p>
      </div>
    </aside>

    <div class="min-h-screen lg:pl-72">
      <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur sm:px-8">
        <div class="flex items-center gap-3">
          <button id="menu-button" class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden" aria-label="Buka navigasi" aria-expanded="false">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <span id="header-title" class="text-sm font-semibold text-slate-700">Dashboard</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="header-cashier" class="hidden text-sm text-slate-500 sm:inline"></span>
          <span id="avatar" class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700" aria-hidden="true"></span>
          <button id="logout-button" type="button" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900">Logout</button>
        </div>
      </header>
      <main id="page-content" class="mx-auto max-w-7xl px-4 py-8 sm:px-8 sm:py-10"></main>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-[70] hidden max-w-sm rounded-xl border px-4 py-3 text-sm shadow-lg" role="status"></div>
  <div id="receipt-modal" class="fixed inset-0 z-[60] hidden items-center justify-center overflow-y-auto bg-slate-950/50 p-4">
    <section id="receipt-card" class="my-auto w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
      <div id="receipt-content"></div>
      <div class="receipt-actions mt-6 flex gap-3">
        <button id="print-receipt" type="button" class="flex-1 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Cetak Struk</button>
        <button id="close-receipt" type="button" class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">Tutup</button>
      </div>
    </section>
  </div>

  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'sembako-jaya-pos-v1';
    const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const CATEGORY_SEEDS = [{id:1,nama:'Makanan'},{id:2,nama:'Minuman'},{id:3,nama:'Bahan Sembako'}];
    const PRODUCT_SEEDS = [
      ['Beras Ramos 5kg','Bahan Sembako','8991000001001',62000,70000,20],
      ['Minyak Goreng Bimoli 2L','Bahan Sembako','8991000001002',32000,38000,24],
      ['Gula Pasir Gulaku 1kg','Bahan Sembako','8991000001003',14500,17500,30],
      ['Telur Ayam Negeri 1kg','Bahan Sembako','8991000001004',26000,30000,25],
      ['Tepung Terigu Segitiga Biru 1kg','Bahan Sembako','8991000001005',11000,14000,24],
      ['Garam Dapur','Bahan Sembako','8991000001006',2500,4000,40],
      ['Mie Instan Indomie Goreng','Makanan','8991000001007',2500,3500,60],
      ['Biskuit Roma Kelapa','Makanan','8991000001008',8500,11000,24],
      ['Roti Tawar Sari Roti','Makanan','8991000001009',12000,16000,15],
      ['Air Mineral Aqua 600ml','Minuman','8991000001010',2500,4000,48],
      ['Teh Botol Sosro','Minuman','8991000001011',3500,5000,36],
      ['Kopi Kapal Api Renteng','Minuman','8991000001012',12000,15000,20]
    ];
    const NAV_ITEMS = [
      {key:'dashboard',title:'Dashboard',group:'Menu utama',icon:'<rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/>'},
      {key:'cashier',title:'Halaman Kasir',group:'Menu utama',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13ZM8 8h8M8 12h3M8 16h8"/>'},
      {key:'categories',title:'Categories',group:'Master data',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="m4 7.5 8-4.5 8 4.5-8 4.5-8-4.5Zm0 4.5 8 4.5 8-4.5M4 16.5 12 21l8-4.5"/>'},
      {key:'products',title:'Products',group:'Master data',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="m4 7.5 8-4.5 8 4.5v9L12 21l-8-4.5v-9Zm.5.3 7.5 4.4 7.5-4.4M12 12.5V21"/>'},
      {key:'suppliers',title:'Suppliers',group:'Master data',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M16 20v-1.5a4.5 4.5 0 0 0-4.5-4.5h-3A4.5 4.5 0 0 0 4 18.5V20M10 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11a3.5 3.5 0 0 0 0-7M17 14h.5a4.5 4.5 0 0 1 4.5 4.5V20"/>'},
      {key:'purchases',title:'Purchases',group:'Operasional',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'},
      {key:'transactions',title:'Transactions',group:'Operasional',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm7 0v5h5M8 13h8M8 17h8"/>'},
      {key:'finance',title:'Laporan Keuangan',group:'Operasional',icon:'<path stroke-linecap="round" stroke-linejoin="round" d="M4 19V5m0 14h16M8 15v-4m4 4V7m4 8v-6m4 6V4"/>'}
    ];
    let store = loadStore();
    let activeUser = store.sessionUser || null;
    let authMode = 'login';
    let page = 'dashboard';
    let cart = [];
    let purchaseCart = [];
    let categoryFilter = 'Semua';
    let searchQuery = '';
    let financePeriod = 'all';
    let receiptTransaction = null;
    let paymentMethod = 'cash';
    let toastTimer;

    function seedStore() {
      const categories = CATEGORY_SEEDS.map(row=>({...row}));
      return {
        accounts: [],
        sessionUser: null,
        categories,
        products: PRODUCT_SEEDS.map((row,index)=>({id:index+1,nama:row[0],kategori_id:categories.find(c=>c.nama===row[1]).id,kode:row[2],harga_beli:row[3],harga_jual:row[4],stok:row[5],stok_minimum:5})),
        suppliers: [
          {id:1,nama:'CV Sumber Pangan',kontak:'Andi Pratama',telepon:'0812-3400-1001',alamat:'Pasar Induk'},
          {id:2,nama:'UD Berkah Grosir',kontak:'Siti Aminah',telepon:'0812-3400-1002',alamat:'Jl. Pasar Baru'},
          {id:3,nama:'PT Mitra Sembako',kontak:'Budi Santoso',telepon:'0812-3400-1003',alamat:'Kawasan Niaga'}
        ],
        transactions: [],
        purchases: [],
        expenses: [],
        initialCapital: 10000000
      };
    }
    function loadStore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && Array.isArray(saved.accounts) && Array.isArray(saved.products) && Array.isArray(saved.transactions)) {
          return {
            ...seedStore(), ...saved,
            categories: Array.isArray(saved.categories) ? saved.categories : CATEGORY_SEEDS.map(row=>({...row})),
            products: saved.products,
            suppliers: Array.isArray(saved.suppliers) ? saved.suppliers : [],
            transactions: Array.isArray(saved.transactions) ? saved.transactions : [],
            purchases: Array.isArray(saved.purchases) ? saved.purchases : [],
            expenses: Array.isArray(saved.expenses) ? saved.expenses : [],
            initialCapital: saved.initialCapital!==null&&saved.initialCapital!==''&&Number.isSafeInteger(Number(saved.initialCapital))&&Number(saved.initialCapital)>=0?Number(saved.initialCapital):10000000
          };
        }
      } catch (error) {
        console.error('Data POS browser tidak dapat dibaca:', error);
      }
      return seedStore();
    }
    function persist() {
      try {
        store.sessionUser = activeUser;
        localStorage.setItem(STORAGE_KEY,JSON.stringify(store));
        return true;
      } catch(error) {
        console.error('Gagal menyimpan data POS ke browser:',error);
        showToast('Penyimpanan browser penuh atau tidak tersedia. Perubahan belum tersimpan.',true);
        return false;
      }
    }
    function backfillPurchaseExpenses() {
      let changed=false;
      for(const purchase of store.purchases) {
        const alreadyRecorded=store.expenses.some(expense=>expense.source==='purchase'&&String(expense.sourceId)===String(purchase.id));
        if(alreadyRecorded) continue;
        const items=(purchase.items||[]).map(item=>({
          produk_id:item.produk_id,
          nama:item.nama,
          qty:Number(item.qty)||0,
          harga:Number(item.harga)||0,
          subtotal:Number(item.subtotal)||((Number(item.qty)||0)*(Number(item.harga)||0))
        }));
        store.expenses.push({
          id:nextId(store.expenses),
          source:'purchase',
          sourceId:purchase.id,
          nomor:purchase.nomor,
          timestamp:Number(purchase.timestamp)||new Date(purchase.tanggal).getTime()||Date.now(),
          tanggal:purchase.tanggal||new Date(Number(purchase.timestamp)||Date.now()).toISOString(),
          pemasok:purchase.pemasok||'',
          jenis:'Pembelian stok',
          items,
          total:Number(purchase.total)||items.reduce((sum,item)=>sum+item.subtotal,0)
        });
        changed=true;
      }
      if(changed) persist();
    }
    function stockExpense(source,sourceId,nomor,timestamp,items,pemasok='') {
      const details=items.map(item=>({
        produk_id:item.produk_id,
        nama:item.nama,
        qty:Number(item.qty),
        harga:Number(item.harga),
        subtotal:Number(item.qty)*Number(item.harga)
      }));
      return {
        id:nextId(store.expenses),
        source,
        sourceId,
        nomor,
        timestamp,
        tanggal:new Date(timestamp).toISOString(),
        pemasok,
        jenis:source==='purchase'?'Pembelian stok':'Penambahan stok',
        items:details,
        total:details.reduce((sum,item)=>sum+item.subtotal,0)
      };
    }
    function initializeAccounts() {
      const username='herlinda';
      let admin=store.accounts.find(account=>String(account.username||'').trim().toLowerCase()===username);
      if(!admin) {
        admin={id:nextId(store.accounts),nama:'HERLINDA',username,password:'admin123',role:'Admin'};
        store.accounts.push(admin);
      } else {
        admin.nama='HERLINDA';
        admin.username=username;
        admin.password='admin123';
        admin.role='Admin';
      }
      for(const account of store.accounts) {
        if(account!==admin) account.role='Kasir';
      }
      const session=store.accounts.find(account=>String(account.id)===String(activeUser?.id));
      activeUser=session?{
        id:session.id,
        nama:String(session.username||'').trim().toLowerCase()===username?'HERLINDA':session.nama,
        username:session.username,
        role:String(session.username||'').trim().toLowerCase()===username?'Admin':'Kasir'
      }:null;
      persist();
    }
    function isAdmin() {
      return activeUser?.role==='Admin'&&String(activeUser.username||'').trim().toLowerCase()==='herlinda';
    }
    function canAccessPage(pageKey) {
      return isAdmin()||['dashboard','cashier','transactions'].includes(pageKey);
    }
    function escapeHtml(value) {
      return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function money(value) { return `Rp ${Number(value||0).toLocaleString('id-ID')}`; }
    function nextId(rows) { return rows.reduce((max,row)=>Math.max(max,Number(row.id)||0),0)+1; }
    function categoryName(id) { return store.categories.find(row=>Number(row.id)===Number(id))?.nama||'Tanpa kategori'; }
    function currentDate() { return new Date(); }
    function invoiceNumber(date) {
      const stamp=`${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
      const seq=String(store.transactions.filter(item=>new Date(item.timestamp).toDateString()===date.toDateString()).length+1).padStart(3,'0');
      return `TRX-${stamp}-${seq}`;
    }
    function dateTime(value) {
      const date=new Date(value);
      if(Number.isNaN(date.getTime())) return '-';
      return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}:${String(date.getSeconds()).padStart(2,'0')}`;
    }
    function showToast(message,error=false) {
      const el=document.getElementById('toast');
      el.textContent=String(message);
      el.className=`fixed bottom-5 right-5 z-[70] max-w-sm rounded-xl border px-4 py-3 text-sm shadow-lg ${error?'border-rose-200 bg-rose-50 text-rose-700':'border-emerald-200 bg-emerald-50 text-emerald-700'}`;
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>el.classList.add('hidden'),4200);
    }
    function authRender() {
      const login=authMode==='login';
      const auth=document.getElementById('auth-screen');
      auth.classList.remove('hidden');
      auth.classList.add('flex');
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('auth-title').textContent=login?'Masuk ke akun':'Daftar akun kasir / admin';
      document.getElementById('auth-description').textContent=login?'Masuk menggunakan username dan kata sandi Anda.':'Buat akun baru untuk mengelola toko Sembako Jaya.';
      document.getElementById('auth-name-wrap').classList.toggle('hidden',login);
      document.querySelector('#auth-name-wrap input').required=!login;
      document.querySelector('#auth-form [name="password"]').autocomplete=login?'current-password':'new-password';
      document.getElementById('auth-submit').textContent=login?'Masuk':'Daftar akun';
      document.getElementById('auth-switch-prompt').textContent=login?'Belum punya akun? ':'Sudah punya akun? ';
      document.getElementById('auth-switch').textContent=login?'Daftar sekarang':'Masuk di sini';
      document.getElementById('auth-error').classList.add('hidden');
    }
    function showApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('flex');
      document.getElementById('app-shell').classList.remove('hidden');
      const name=activeUser?.nama||'Kasir';
      const badge=document.getElementById('header-cashier');
      badge.textContent=`${isAdmin()?'Admin':'Kasir'} - ${name}`;
      badge.className=`inline-flex rounded-full border px-2 py-1 text-[10px] font-semibold sm:px-3 sm:text-xs ${isAdmin()?'border-indigo-100 bg-indigo-50 text-indigo-700':'border-emerald-100 bg-emerald-50 text-emerald-700'}`;
      document.getElementById('avatar').textContent=Array.from(name)[0]?.toLocaleUpperCase()||'K';
      renderPage(page);
    }
    function authSubmit(event) {
      event.preventDefault();
      const form=event.currentTarget;
      const username=form.elements.username.value.trim().toLowerCase();
      const password=form.elements.password.value;
      const error=document.getElementById('auth-error');
      try {
        if(authMode==='register') {
          const nama=form.elements.nama.value.trim();
          if(!nama||nama.length>80) throw Error('Nama kasir/admin wajib diisi (maksimal 80 karakter).');
          if(!/^[a-z0-9._-]{3,32}$/.test(username)) throw Error('Username harus 3–32 karakter: huruf, angka, titik, garis bawah, atau strip.');
          if(username==='herlinda') throw Error('Username HERLINDA khusus untuk akun Admin.');
          if(password.length<8) throw Error('Kata sandi harus memiliki minimal 8 karakter.');
          if(store.accounts.some(account=>String(account.username||'').trim().toLowerCase()===username)) throw Error('Username tersebut sudah digunakan.');
          const account={id:nextId(store.accounts),nama,username,password,role:'Kasir'};
          store.accounts.push(account);
          activeUser={id:account.id,nama:account.nama,username:account.username,role:account.role};
          if(!persist()) throw Error('Tidak dapat menyimpan akun ke localStorage.');
          page='dashboard';showApp();showToast('Akun berhasil dibuat. Selamat datang!');
          return;
        }
        const account=store.accounts.find(row=>String(row.username||'').trim().toLowerCase()===username);
        const validAdminPassword=username==='herlinda'&&['admin123','herlinda123'].includes(password);
        if(!account||!(validAdminPassword||account.password===password)) throw Error('Username atau kata sandi tidak sesuai.');
        const adminLogin=username==='herlinda';
        activeUser={id:account.id,nama:adminLogin?'HERLINDA':account.nama,username:adminLogin?'herlinda':account.username,role:adminLogin?'Admin':'Kasir'};
        if(!persist()) throw Error('Tidak dapat menyimpan sesi ke localStorage.');
        page='dashboard';showApp();
      } catch(errorValue) {
        error.textContent=errorValue.message||'Gagal memproses akun.';
        error.classList.remove('hidden');
      }
    }

    function renderFinanceReport() {
      const now=currentDate();
      const todayKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const monthKey=todayKey.slice(0,7);
      const timestampOf=item=>Number(item.timestamp)>0?Number(item.timestamp):new Date(item.tanggal).getTime();
      const allEvents=[
        ...store.transactions.map(item=>({timestamp:timestampOf(item),nomor:item.nomor,jenis:`Penjualan · ${item.metodePembayaran||'Tunai'}`,keterangan:(item.items||[]).map(detail=>`${detail.nama} × ${detail.qty}`).join(', '),pemasukan:Number(item.total)||0,pengeluaran:0})),
        ...store.expenses.map(item=>({timestamp:timestampOf(item),nomor:item.nomor,jenis:item.jenis||'Penambahan stok',keterangan:`${item.pemasok?`${item.pemasok} · `:''}${(item.items||[]).map(detail=>`${detail.nama} × ${detail.qty}`).join(', ')}`,pemasukan:0,pengeluaran:Number(item.total)||0}))
      ].filter(item=>Number.isFinite(item.timestamp)).sort((a,b)=>a.timestamp-b.timestamp);
      const income=allEvents.reduce((sum,item)=>sum+item.pemasukan,0);
      const expenses=allEvents.reduce((sum,item)=>sum+item.pengeluaran,0);
      const net=income-expenses;
      let runningNet=0;
      const events=allEvents.map(item=>{
        runningNet+=item.pemasukan-item.pengeluaran;
        return {...item,laba:Math.max(0,runningNet),rugi:Math.max(0,-runningNet)};
      }).filter(item=>{
        const date=new Date(item.timestamp);
        if(financePeriod==='today') return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`===todayKey;
        if(financePeriod==='month') return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`===monthKey;
        return true;
      }).reverse().map(item=>row([
        escapeHtml(dateTime(item.timestamp)),
        `<span class="font-semibold text-indigo-700">${escapeHtml(item.nomor||'-')}</span>`,
        `<span class="font-medium text-slate-800">${escapeHtml(item.jenis)}</span><div class="mt-1 max-w-xl whitespace-normal text-xs text-slate-500">${escapeHtml(item.keterangan||'-')}</div>`,
        '-',
        item.pemasukan?`<span class="font-semibold text-emerald-700">${money(item.pemasukan)}</span>`:'-',
        item.pengeluaran?`<span class="font-semibold text-rose-700">${money(item.pengeluaran)}</span>`:'-',
        item.laba?`<span class="font-semibold text-emerald-700">${money(item.laba)}</span>`:'-',
        item.rugi?`<span class="font-semibold text-rose-700">${money(item.rugi)}</span>`:'-'
      ])).join('');
      const openingCapitalRow=row([
        '-','-','<span class="font-semibold text-slate-800">Modal awal toko</span>',
        `<span class="font-semibold text-indigo-700">${money(store.initialCapital)}</span>`,
        '-','-','-','-'
      ]);
      const laba=Math.max(0,net);
      const rugi=Math.max(0,-net);
      return `<div id="finance-report">
        ${sectionTitle('Laporan Keuangan','Ringkasan omzet penjualan dan pengeluaran pembelian stok.',primaryButton('Cetak Laporan','type="button" data-action="print-report"'))}
        <section class="grid gap-5 sm:grid-cols-2 xl:grid-cols-5" aria-label="Ringkasan laporan keuangan">
          <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><p class="text-sm font-medium text-slate-500">Modal Awal</p><p class="mt-3 text-2xl font-bold tracking-tight text-indigo-700">${money(store.initialCapital)}</p><form id="capital-form" class="mt-4 space-y-3"><label class="block text-xs font-medium text-slate-600">Atur modal awal<input name="initialCapital" type="number" min="0" step="1" required value="${store.initialCapital}" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"></label><button type="submit" class="w-full rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-2 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-100">Simpan Modal</button></form></article>
          <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><p class="text-sm font-medium text-slate-500">Total Pemasukan</p><p class="mt-3 text-2xl font-bold tracking-tight text-emerald-700">${money(income)}</p><p class="mt-1 text-xs text-slate-500">Omzet penjualan</p></article>
          <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><p class="text-sm font-medium text-slate-500">Total Pengeluaran</p><p class="mt-3 text-2xl font-bold tracking-tight text-rose-700">${money(expenses)}</p><p class="mt-1 text-xs text-slate-500">Modal / pembelian stok</p></article>
          <article class="rounded-2xl border border-emerald-200 bg-emerald-50 p-6 shadow-sm"><p class="text-sm font-medium text-emerald-700">Total Laba</p><p class="mt-3 text-2xl font-bold tracking-tight text-emerald-700">${money(laba)}</p><p class="mt-1 text-xs text-emerald-700">Keuntungan bersih</p></article>
          <article class="rounded-2xl border border-rose-200 bg-rose-50 p-6 shadow-sm"><p class="text-sm font-medium text-rose-700">Total Rugi</p><p class="mt-3 text-2xl font-bold tracking-tight text-rose-700">${money(rugi)}</p><p class="mt-1 text-xs text-rose-700">Defisit bersih</p></article>
        </section>
        <section class="mt-8">
          <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><h2 class="font-semibold text-slate-900">Rincian Arus Kas</h2><p class="mt-1 text-xs text-slate-500">Data transaksi penjualan dan pembelian stok</p></div><label class="block text-sm font-medium text-slate-700">Periode<select id="finance-period" class="mt-1.5 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"><option value="all" ${financePeriod==='all'?'selected':''}>Semua</option><option value="today" ${financePeriod==='today'?'selected':''}>Hari Ini</option><option value="month" ${financePeriod==='month'?'selected':''}>Bulan Ini</option></select></label></div>
          ${table(['Tanggal & waktu','No. Referensi','Jenis / keterangan','Modal Awal (Rp)','Pemasukan (Rp)','Pengeluaran (Rp)','Laba (Rp)','Rugi (Rp)'],`${events}${openingCapitalRow}`,'Belum ada arus kas pada periode ini.')}
        </section>
      </div>`;
    }
    const PAGE_RENDERERS={dashboard:renderDashboard,cashier:renderCashier,categories:renderCategories,products:renderProducts,suppliers:renderSuppliers,purchases:renderPurchases,transactions:renderTransactions,finance:renderFinanceReport};
    const PAGE_TITLES={dashboard:'Dashboard',cashier:'Halaman Kasir',categories:'Categories',products:'Products',suppliers:'Suppliers',purchases:'Purchases',transactions:'Transactions',finance:'Laporan Keuangan'};
    function navigate(nextPage,query='') {
      const allowed=PAGE_RENDERERS[nextPage]&&canAccessPage(nextPage);
      page=allowed?nextPage:'dashboard';
      const url=`/?page=${page}${query}`;
      history.pushState({page},'',url);
      closeSidebar();
      renderPage();
      if(!allowed) showToast('Menu tersebut hanya dapat diakses Admin.',true);
    }
    function renderPage() {
      if(!activeUser){authRender();return;}
      if(!PAGE_RENDERERS[page]||!canAccessPage(page)) {
        page='dashboard';
        history.replaceState({page},'','/?page=dashboard');
      }
      document.getElementById('navigation').innerHTML=navHtml();
      document.getElementById('header-title').textContent=PAGE_TITLES[page];
      document.title=`${PAGE_TITLES[page]} | Sembako Jaya`;
      document.getElementById('page-content').innerHTML=PAGE_RENDERERS[page]();
      if(page==='cashier') {
        const field=document.querySelector('#cashier-form [name="tunai"]');
        if(field&&window.cashierPayment) field.value=window.cashierPayment;
        updateChange();
      }
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden');
      document.getElementById('menu-button').setAttribute('aria-expanded','false');
    }
    function addToCart(productId) {
      const product=store.products.find(item=>Number(item.id)===Number(productId));
      if(!product) throw Error('Produk tidak ditemukan.');
      const existing=cart.find(item=>Number(item.id)===Number(product.id));
      if((existing?.qty||0)>=Number(product.stok)) throw Error(`Stok ${product.nama} tidak cukup.`);
      if(existing) existing.qty+=1;
      else cart.push({id:product.id,nama:product.nama,kode:product.kode,harga_jual:Number(product.harga_jual),qty:1});
      renderPage();
    }
    function updateCart(type,id,delta) {
      const target=type==='sale'?cart:purchaseCart;
      const item=target.find(row=>Number(row.id)===Number(id));
      if(!item) return;
      if(delta>0&&type==='sale') {
        const product=store.products.find(row=>Number(row.id)===Number(id));
        if(item.qty>=Number(product?.stok||0)) throw Error(`Stok ${item.nama} tidak cukup.`);
      }
      item.qty+=delta;
      if(item.qty<=0) target.splice(target.indexOf(item),1);
      renderPage();
    }
    function addPurchaseItem() {
      const form=document.getElementById('purchase-form');
      const productId=Number(form.elements.produk_id.value);
      const qty=Number(form.elements.jumlah.value);
      const product=store.products.find(row=>Number(row.id)===productId);
      if(!product||!Number.isSafeInteger(qty)||qty<1) throw Error('Pilih produk dan masukkan jumlah yang valid.');
      const existing=purchaseCart.find(row=>Number(row.id)===productId);
      if(existing) existing.qty+=qty;
      else purchaseCart.push({id:product.id,nama:product.nama,harga_beli:Number(product.harga_beli),qty});
      renderPage();
    }
    function updateChange() {
      const field=document.querySelector('#cashier-form [name="tunai"]');
      const label=document.getElementById('change-value');
      if(!field||!label) return;
      window.cashierPayment=field.value;
      const total=cart.reduce((sum,item)=>sum+item.harga_jual*item.qty,0);
      const change=Number(field.value||0)-total;
      label.textContent=`Kembalian: ${money(Math.max(0,change))}${change<0?' · kurang '+money(-change):''}`;
      label.className=`rounded-lg px-4 py-3 text-sm font-semibold ${change>=0?'bg-indigo-50 text-indigo-700':'bg-rose-50 text-rose-700'}`;
    }
    function processSale(form) {
      if(!cart.length) throw Error('Keranjang masih kosong.');
      const total=cart.reduce((sum,item)=>sum+item.harga_jual*item.qty,0);
      const paid=paymentMethod==='qris'?total:Number(form.elements.tunai.value);
      if(!Number.isSafeInteger(paid)||paid<total) throw Error('Uang tunai harus sama dengan atau lebih besar dari total belanja.');
      for(const item of cart) {
        const product=store.products.find(row=>Number(row.id)===Number(item.id));
        if(!product||product.stok<item.qty) throw Error(`Stok ${item.nama} tidak cukup.`);
      }
      const now=currentDate();
      const transaction={
        id:nextId(store.transactions),
        nomor:invoiceNumber(now),
        timestamp:now.getTime(),
        tanggal:now.toISOString(),
        kasir:activeUser.nama,
        items:cart.map(item=>({produk_id:item.id,nama:item.nama,kode:item.kode,qty:item.qty,harga:Number(item.harga_jual),subtotal:Number(item.harga_jual)*item.qty})),
        total,tunai:paid,kembalian:paid-total,metodePembayaran:paymentMethod==='qris'?'QRIS':'Tunai'
      };
      for(const item of transaction.items) {
        const product=store.products.find(row=>Number(row.id)===Number(item.produk_id));
        product.stok-=item.qty;
      }
      store.transactions.push(transaction);
      if(!persist()) {
        for(const item of transaction.items) {
          const product=store.products.find(row=>Number(row.id)===Number(item.produk_id));
          product.stok+=item.qty;
        }
        store.transactions=store.transactions.filter(row=>row.id!==transaction.id);
        throw Error('Transaksi dibatalkan karena gagal menyimpan data.');
      }
      cart=[];window.cashierPayment='';paymentMethod='cash';
      renderPage();
      openReceipt(transaction);
    }
    function openReceipt(transaction) {
      receiptTransaction=transaction;
      document.getElementById('receipt-content').innerHTML=`
        <div class="text-center"><h2 class="text-xl font-extrabold tracking-wide text-slate-900">SEMBAKO JAYA</h2><p class="mt-1 text-xs text-slate-500">Struk Pembayaran</p></div>
        <div class="my-4 border-y border-dashed border-slate-300 py-3 text-xs leading-6 text-slate-600">
          <div class="flex justify-between gap-2"><span>No. Nota</span><strong class="text-slate-900">${escapeHtml(transaction.nomor)}</strong></div>
          <div class="flex justify-between gap-2"><span>Tanggal/Waktu</span><strong class="text-right text-slate-900">${escapeHtml(dateTime(transaction.timestamp))}</strong></div>
          <div class="flex justify-between gap-2"><span>Kasir</span><strong class="text-slate-900">${escapeHtml(transaction.kasir)}</strong></div>
          <div class="flex justify-between gap-2"><span>Metode Pembayaran</span><strong class="text-slate-900">${escapeHtml(transaction.metodePembayaran||'Tunai')}</strong></div>
        </div>
        <div class="space-y-3">${transaction.items.map(item=>`<div class="text-sm"><div class="font-semibold text-slate-800">${escapeHtml(item.nama)}</div><div class="flex justify-between gap-2 text-xs text-slate-500"><span>${item.qty} × ${money(item.harga)}</span><span>${money(item.subtotal)}</span></div></div>`).join('')}</div>
        <div class="mt-4 space-y-2 border-t border-dashed border-slate-300 pt-3 text-sm">
          <div class="flex justify-between font-bold text-slate-900"><span>Total Belanja</span><span>${money(transaction.total)}</span></div>
          <div class="flex justify-between text-slate-600"><span>Dibayar</span><span>${money(transaction.tunai)}</span></div>
          <div class="flex justify-between font-semibold text-slate-900"><span>Kembalian</span><span>${money(transaction.kembalian)}</span></div>
        </div><p class="mt-6 text-center text-xs text-slate-500">Terima kasih telah berbelanja di Sembako Jaya.</p>`;
      document.getElementById('receipt-modal').classList.remove('hidden');
      document.getElementById('receipt-modal').classList.add('flex');
    }
    function closeReceipt() {
      document.getElementById('receipt-modal').classList.add('hidden');
      document.getElementById('receipt-modal').classList.remove('flex');
      receiptTransaction=null;
    }
    function submitForm(form) {
      const data=Object.fromEntries(new FormData(form).entries());
      if(form.id==='category-form') {
        const nama=String(data.nama||'').trim();
        if(!nama) throw Error('Nama kategori wajib diisi.');
        if(store.categories.some(row=>row.nama.toLocaleLowerCase()===nama.toLocaleLowerCase())) throw Error('Kategori sudah tersedia.');
        store.categories.push({id:nextId(store.categories),nama});
        persist();renderPage();showToast('Kategori berhasil disimpan.');return;
      }
      if(form.id==='product-form') {
        const product={nama:String(data.nama).trim(),kode:String(data.kode).trim(),kategori_id:Number(data.kategori_id),harga_beli:Number(data.harga_beli),harga_jual:Number(data.harga_jual),stok:Number(data.stok),stok_minimum:5};
        if(!product.nama||!product.kode||!Number.isSafeInteger(product.harga_beli)||product.harga_beli<0||!Number.isSafeInteger(product.harga_jual)||product.harga_jual<=0||!Number.isSafeInteger(product.stok)||product.stok<0) throw Error('Periksa kembali nama, kode, harga, dan stok produk.');
        const id=Number(form.dataset.id);
        const existing=id?store.products.find(row=>Number(row.id)===id):null;
        if(id&&!existing) throw Error('Produk yang akan diperbarui tidak ditemukan.');
        const previous=existing?{...existing}:null;
        const savedProduct=existing?Object.assign(existing,product):{id:nextId(store.products),...product};
        if(!existing) store.products.push(savedProduct);
        const stockAdded=Math.max(0,product.stok-(previous?.stok||0));
        let expense=null;
        if(stockAdded>0) {
          const now=currentDate();
          const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
          const reference=`ST-${stamp}-${String(store.expenses.length+1).padStart(3,'0')}`;
          expense=stockExpense('product',savedProduct.id,reference,now.getTime(),[{produk_id:savedProduct.id,nama:product.nama,qty:stockAdded,harga:product.harga_beli}]);
          store.expenses.push(expense);
        }
        if(!persist()) {
          if(expense) store.expenses=store.expenses.filter(item=>item.id!==expense.id);
          if(existing) Object.assign(existing,previous);
          else store.products=store.products.filter(item=>item.id!==savedProduct.id);
          throw Error('Perubahan produk dibatalkan karena gagal menyimpan data.');
        }
        history.replaceState({page:'products'},'','/?page=products');renderPage();showToast(stockAdded?`${id?'Produk diperbarui':'Produk ditambahkan'}; pengeluaran stok ${money(stockAdded*product.harga_beli)} tercatat.`:id?'Produk berhasil diperbarui.':'Produk berhasil ditambahkan.');return;
      }
      if(form.id==='capital-form') {
        const initialCapital=Number(data.initialCapital);
        if(!Number.isSafeInteger(initialCapital)||initialCapital<0) throw Error('Modal awal harus berupa angka bulat minimal Rp 0.');
        const previous=store.initialCapital;
        store.initialCapital=initialCapital;
        if(!persist()) {
          store.initialCapital=previous;
          throw Error('Perubahan modal awal dibatalkan karena gagal disimpan.');
        }
        renderPage();showToast('Modal awal berhasil diperbarui.');return;
      }
      if(form.id==='supplier-form') {
        const supplier={nama:String(data.nama||'').trim(),kontak:String(data.kontak||'').trim(),telepon:String(data.telepon||'').trim(),alamat:String(data.alamat||'').trim()};
        if(!supplier.nama) throw Error('Nama pemasok wajib diisi.');
        const id=Number(form.dataset.id);
        if(id) Object.assign(store.suppliers.find(row=>Number(row.id)===id),supplier);
        else store.suppliers.push({id:nextId(store.suppliers),...supplier});
        persist();renderPage();showToast(id?'Data pemasok diperbarui.':'Pemasok berhasil ditambahkan.');return;
      }
      if(form.id==='cashier-form') { processSale(form);return; }
      if(form.id==='purchase-form') {
        const supplier=store.suppliers.find(row=>Number(row.id)===Number(data.pemasok_id));
        if(!supplier) throw Error('Pilih pemasok yang valid.');
        if(!purchaseCart.length) throw Error('Tambahkan minimal satu produk ke pembelian.');
        const now=currentDate();
        const purchase={id:nextId(store.purchases),nomor:`PB-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(store.purchases.length+1).padStart(3,'0')}`,timestamp:now.getTime(),tanggal:now.toISOString(),pemasok:supplier.nama,items:purchaseCart.map(item=>({produk_id:item.id,nama:item.nama,qty:item.qty,harga:Number(item.harga_beli),subtotal:Number(item.harga_beli)*item.qty})),total:purchaseCart.reduce((sum,item)=>sum+item.harga_beli*item.qty,0)};
        for(const item of purchase.items) {
          const product=store.products.find(row=>Number(row.id)===Number(item.produk_id));
          if(!product) throw Error(`Produk ${item.nama} tidak ditemukan.`);
          product.stok+=item.qty;
        }
        store.purchases.push(purchase);
        const expense=stockExpense('purchase',purchase.id,purchase.nomor,purchase.timestamp,purchase.items.map(item=>({produk_id:item.produk_id,nama:item.nama,qty:item.qty,harga:item.harga})),purchase.pemasok);
        store.expenses.push(expense);
        if(!persist()) {
          for(const item of purchase.items) store.products.find(row=>Number(row.id)===Number(item.produk_id)).stok-=item.qty;
          store.purchases=store.purchases.filter(row=>row.id!==purchase.id);
          store.expenses=store.expenses.filter(item=>item.id!==expense.id);
          throw Error('Pembelian dibatalkan karena gagal menyimpan data.');
        }
        purchaseCart=[];renderPage();showToast(`Pembelian ${purchase.nomor} tersimpan. Stok produk bertambah.`);return;
      }
    }
    function editSupplier(id) {
      const supplier=store.suppliers.find(row=>Number(row.id)===Number(id));
      if(!supplier) throw Error('Pemasok tidak ditemukan.');
      const form=document.getElementById('supplier-form');
      form.dataset.id=supplier.id;
      for(const field of ['nama','kontak','telepon','alamat']) form.elements[field].value=supplier[field]||'';
      document.getElementById('supplier-form-title').textContent='Edit pemasok';
      form.querySelector('button[type="submit"]').textContent='Simpan perubahan';
      document.getElementById('supplier-cancel').classList.remove('hidden');
      form.scrollIntoView({behavior:'smooth',block:'center'});
    }
    function handleAction(element) {
      const action=element.dataset.action;
      const id=Number(element.dataset.id);
      if(action==='filter-category') {categoryFilter=element.dataset.category;renderPage();return;}
      if(action==='select-payment') {
        paymentMethod=element.dataset.method==='qris'?'qris':'cash';
        renderPage();
        return;
      }
      if(action==='add-cart') {addToCart(id);return;}
      if(action==='qty-plus'||action==='qty-minus') {updateCart(element.dataset.type,id,action==='qty-plus'?1:-1);return;}
      if(action==='remove-item') {const target=element.dataset.type==='sale'?cart:purchaseCart;const index=target.findIndex(item=>Number(item.id)===id);if(index>=0)target.splice(index,1);renderPage();return;}
      if(action==='clear-cart') {cart=[];window.cashierPayment='';paymentMethod='cash';renderPage();return;}
      if(action==='add-purchase-item') {addPurchaseItem();return;}
      if(action==='edit-product') {navigate('products',`&edit=${id}`);return;}
      if(action==='delete-product') {
        const product=store.products.find(item=>Number(item.id)===id);
        if(store.transactions.some(tx=>tx.items.some(item=>Number(item.produk_id)===id))) throw Error('Produk sudah ada di nota penjualan dan tidak dapat dihapus.');
        if(product&&confirm(`Hapus produk "${product.nama}"?`)) {store.products=store.products.filter(item=>Number(item.id)!==id);persist();renderPage();showToast('Produk dihapus.');}
        return;
      }
      if(action==='delete-category') {
        const category=store.categories.find(item=>Number(item.id)===id);
        if(store.products.some(item=>Number(item.kategori_id)===id)) throw Error('Kategori masih digunakan oleh produk.');
        if(category&&confirm(`Hapus kategori "${category.nama}"?`)) {store.categories=store.categories.filter(item=>Number(item.id)!==id);persist();renderPage();showToast('Kategori dihapus.');}
        return;
      }
      if(action==='edit-supplier') {editSupplier(id);return;}
      if(action==='delete-supplier') {
        const supplier=store.suppliers.find(item=>Number(item.id)===id);
        if(store.purchases.some(item=>item.pemasok===supplier?.nama)) throw Error('Pemasok sudah tercatat pada riwayat pembelian.');
        if(supplier&&confirm(`Hapus pemasok "${supplier.nama}"?`)) {store.suppliers=store.suppliers.filter(item=>Number(item.id)!==id);persist();renderPage();showToast('Pemasok dihapus.');}
        return;
      }
      if(action==='show-receipt') {
        const transaction=store.transactions.find(item=>Number(item.id)===id);
        if(transaction) openReceipt(transaction);
        return;
      }
      if(action==='print-report'&&isAdmin()) {
        document.body.classList.add('printing-report');
        window.print();
        setTimeout(()=>document.body.classList.remove('printing-report'),500);
      }
    }
    function logout() {
      activeUser=null;store.sessionUser=null;persist();cart=[];purchaseCart=[];window.cashierPayment='';paymentMethod='cash';authMode='login';authRender();
    }

    document.getElementById('auth-form').addEventListener('submit',authSubmit);
    document.getElementById('auth-switch').addEventListener('click',()=>{authMode=authMode==='login'?'register':'login';authRender();});
    document.getElementById('toggle-password').addEventListener('click',event=>{
      const input=document.getElementById('auth-password');
      const button=event.currentTarget;
      const visible=input.type==='password';
      input.type=visible?'text':'password';
      button.setAttribute('aria-pressed',String(visible));
      button.setAttribute('aria-label',visible?'Sembunyikan kata sandi':'Tampilkan kata sandi');
      button.innerHTML=visible
        ?'<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path stroke-linecap="round" stroke-linejoin="round" d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6 0 9.5 7 9.5 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.9 7.8 2.5 12 2.5 12s3.5 7 9.5 7c.8 0 1.6-.1 2.3-.4"/></svg>'
        :'<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
    });
    document.getElementById('logout-button').addEventListener('click',logout);
    document.getElementById('menu-button').addEventListener('click',()=>{
      const open=document.getElementById('menu-button').getAttribute('aria-expanded')!=='true';
      document.getElementById('sidebar').classList.toggle('-translate-x-full',!open);
      document.getElementById('sidebar-overlay').classList.toggle('hidden',!open);
      document.getElementById('menu-button').setAttribute('aria-expanded',String(open));
    });
    document.getElementById('sidebar-overlay').addEventListener('click',closeSidebar);
    document.getElementById('navigation').addEventListener('click',event=>{
      const link=event.target.closest('[data-page]');
      if(link){event.preventDefault();navigate(link.dataset.page);}
    });
    document.querySelector('#sidebar > a[data-page]').addEventListener('click',event=>{event.preventDefault();navigate('dashboard');});
    document.getElementById('page-content').addEventListener('click',event=>{
      const element=event.target.closest('[data-action]');
      if(!element)return;
      try{handleAction(element);}catch(error){showToast(error.message||'Aksi tidak dapat dilakukan.',true);}
    });
    document.getElementById('page-content').addEventListener('input',event=>{
      if(event.target.id==='product-search'){searchQuery=event.target.value;const field=event.target;renderPage();const next=document.getElementById('product-search');next.focus();next.setSelectionRange(searchQuery.length,searchQuery.length);}
      if(event.target.name==='tunai')updateChange();
    });
    document.getElementById('page-content').addEventListener('submit',event=>{
      event.preventDefault();
      try{submitForm(event.target);}catch(error){showToast(error.message||'Data tidak dapat disimpan.',true);}
    });
    document.getElementById('page-content').addEventListener('click',event=>{
      if(event.target.closest('#supplier-cancel'))renderPage();
    });
    window.addEventListener('popstate',()=>{
      const next=new URLSearchParams(location.search).get('page')||'dashboard';
      page=PAGE_RENDERERS[next]&&canAccessPage(next)?next:'dashboard';
      if(page==='dashboard'&&next!=='dashboard') history.replaceState({page},'','/?page=dashboard');
      renderPage();
    });
    document.getElementById('print-receipt').addEventListener('click',()=>{
      if(!receiptTransaction)return;
      document.body.classList.add('printing');
      window.print();
      setTimeout(()=>document.body.classList.remove('printing'),500);
    });
    document.getElementById('close-receipt').addEventListener('click',closeReceipt);
    document.getElementById('receipt-modal').addEventListener('click',event=>{if(event.target.id==='receipt-modal')closeReceipt();});
    document.getElementById('page-content').addEventListener('change',event=>{
      if(event.target.id==='finance-period') {
        financePeriod=event.target.value;
        renderPage();
      }
    });
    window.addEventListener('afterprint',()=>document.body.classList.remove('printing','printing-report'));

    initializeAccounts();
    backfillPurchaseExpenses();
    const requestedPage=new URLSearchParams(location.search).get('page');
    if(PAGE_RENDERERS[requestedPage]&&canAccessPage(requestedPage)) page=requestedPage;
    else if(requestedPage) history.replaceState({page},'','/?page=dashboard');
    if(activeUser&&store.accounts.some(account=>account.id===activeUser.id)) showApp();
    else {activeUser=null;authRender();}
  })();
  </script>
</body>
</html>
